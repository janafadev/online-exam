<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administration - Ajouter un examen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Créer un nouvel examen</h2>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/exam/add}" th:object="${exam}" method="post">
                        <div class="mb-3">
                            <label for="title" class="form-label">Titre de l’examen</label>
                            <input type="text" class="form-control" id="title" th:field="*{title}" required>
                        </div>
                        <div class="mb-3">
                            <label for="duration" class="form-label">Durée (en minutes)</label>
                            <input type="number" class="form-control" id="duration" th:field="*{durationInMinutes}" required min="1">
                        </div>
                        <button type="submit" class="btn btn-primary">Créer l’examen et ajouter des questions</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
