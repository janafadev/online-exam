<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Gérer les examens</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Gérer les examens</h2>
    <a th:href="@{/admin/exam/add}" class="btn btn-primary">
      <i class="bi bi-plus-circle-fill me-2"></i>Créer un examen
    </a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
          <tr>
            <th scope="col">Titre de l’examen</th>
            <th scope="col">Durée (min)</th>
            <th scope="col">Questions</th>
            <th scope="col">Actions</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="exam : ${exams}">
            <td th:text="${exam.title}">Titre de l’examen</td>
            <td th:text="${exam.durationInMinutes}">60</td>
            <td th:text="${#lists.size(exam.questions)}">10</td>
            <td>
              <!-- Add Questions Button -->
              <a th:href="@{/admin/exam/{examId}/question/add(examId=${exam.id})}"
                 class="btn btn-sm btn-success me-1" title="Ajouter des questions">
                <i class="bi bi-plus-lg"></i> Questions
              </a>
              <!-- View Results Button -->
              <a th:href="@{/admin/results/{examId}(examId=${exam.id})}"
                 class="btn btn-sm btn-info me-1" title="Voir les résultats">
                <i class="bi bi-bar-chart-fill"></i> Résultats
              </a>

              <!-- Manage Questions Button -->
              <a th:href="@{/admin/exam/manage-questions/{examId}(examId=${exam.id})}"
                 class="btn btn-sm btn-secondary me-1" title="Gérer les questions">
                <i class="bi bi-list-task"></i> Gérer
              </a>

              <!-- Edit Exam Button -->
              <a th:href="@{/admin/exam/edit/{examId}(examId=${exam.id})}"
                 class="btn btn-sm btn-warning me-1" title="Modifier l’examen">
                <i class="bi bi-pencil-fill"></i> Modifier
              </a>

              <!-- Delete Exam Button -->
              <a th:href="@{/admin/exam/delete/{examId}(examId=${exam.id})}"
                 class="btn btn-sm btn-danger" title="Supprimer l’examen"
                 onclick="return confirm('Voulez-vous vraiment supprimer cet examen ? Toutes les questions et tous les résultats associés seront supprimés.');">
                <i class="bi bi-trash-fill"></i> Supprimer
              </a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(exams)}">
            <td colspan="4" class="text-center fst-italic">Aucun examen. Cliquez sur « Créer un examen » pour commencer.</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
